[package]
name = "ort-bench"
version = "0.0.0"
edition = "2021"

[dependencies]
# default-features off: ort's default downloader uses native-tls, which needs libssl-dev (not installed here).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls", "copy-dylibs", "webgpu", "api-24"] }
serde_json = "1"

[profile.release]
debug = 1
